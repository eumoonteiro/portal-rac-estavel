<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão EAD - Portal RAC</title>
    <!-- TailwindCSS e Ícones -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e0e7ff 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(31, 38, 135, 0.15);
        }
    </style>
</head>
<body class="p-4 md:p-10 flex flex-col items-center">

    <div class="w-full max-w-4xl glass-panel rounded-3xl p-8">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-extrabold text-gray-800 flex items-center gap-3">
                    <div class="p-2 bg-purple-100 text-purple-600 rounded-lg"><i data-lucide="shield-check" class="w-6 h-6"></i></div>
                    Controle de Acesso (Cursos EAD)
                </h1>
                <p class="text-sm text-gray-500 mt-2 font-medium">Libere ou bloqueie o acesso dos alunos à disciplina "Metodologia Científica".</p>
            </div>
            <a href="index.html" class="px-5 py-2.5 bg-white border border-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-50 hover:text-purple-600 transition flex items-center gap-2 shadow-sm">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar ao Portal
            </a>
        </div>

        <!-- Tela de Carregamento -->
        <div id="loading" class="text-center py-16">
            <i data-lucide="loader-2" class="w-8 h-8 text-purple-500 animate-spin mx-auto mb-4"></i>
            <p class="text-gray-500 font-medium">Sincronizando com o banco de dados...</p>
        </div>

        <!-- Tabela -->
        <div class="overflow-x-auto rounded-2xl border border-gray-100 shadow-sm bg-white/50 hidden" id="tabela-container">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-600 text-xs uppercase tracking-widest border-b border-gray-200">
                        <th class="p-4 font-bold">Nome do Aluno</th>
                        <th class="p-4 font-bold">CPF</th>
                        <th class="p-4 font-bold text-center">Acesso: Metodologia Científica</th>
                    </tr>
                </thead>
                <tbody id="lista-alunos" class="divide-y divide-gray-100 text-sm">
                    <!-- Linhas injetadas via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script de Integração Direta com Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Chaves Extraídas do Ambiente Atual
        const firebaseConfig = {
            apiKey: "AIzaSyBI_PS9poJyyCrGgTXaU82xNoEGCh6jFK0",
            authDomain: "portal-rac.firebaseapp.com",
            projectId: "portal-rac",
            storageBucket: "portal-rac.firebasestorage.app",
            messagingSenderId: "844052242861",
            appId: "1:844052242861:web:03aff23e67ec52c07fc124",
        };

        const app = initializeApp(firebaseConfig, "AppAdminEAD");
        const db = getFirestore(app);

        async function carregarAlunos() {
            try {
                // Busca APENAS usuários que são "alunos"
                const q = query(collection(db, "utilizadores"), where("role", "==", "aluno"));
                const querySnapshot = await getDocs(q);
                
                const tbody = document.getElementById("lista-alunos");
                tbody.innerHTML = "";
                
                let alunos = [];
                querySnapshot.forEach((docSnap) => {
                    alunos.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Ordem Alfabética
                alunos.sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));

                if (alunos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-gray-500">Nenhum aluno cadastrado no sistema.</td></tr>`;
                }

                alunos.forEach(aluno => {
                    // Verifica se já tem acesso
                    const temAcesso = aluno.cursos_ead && aluno.cursos_ead.includes("metodologia");
                    
                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-purple-50/50 transition";
                    tr.innerHTML = `
                        <td class="p-4 font-bold text-gray-800 flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center text-purple-700 font-bold text-xs">
                                ${(aluno.nome || "??").substring(0, 2).toUpperCase()}
                            </div>
                            ${aluno.nome || "Sem Nome Cadastrado"}
                        </td>
                        <td class="p-4 text-gray-500 font-medium">${aluno.cpf || "---"}</td>
                        <td class="p-4 text-center">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer" ${temAcesso ? 'checked' : ''} onchange="window.toggleAcesso('${aluno.id}', this.checked, this)">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-purple-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
                            </label>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById("loading").classList.add("hidden");
                document.getElementById("tabela-container").classList.remove("hidden");

            } catch(e) {
                console.error("Erro ao puxar alunos do Firebase:", e);
                document.getElementById("loading").innerHTML = '<p class="text-red-500 font-bold">Erro ao carregar o banco de dados.</p>';
            }
        }

        // Função Global para salvar o click no banco
        window.toggleAcesso = async (alunoId, isChecked, checkboxEl) => {
            checkboxEl.disabled = true; // Desabilita enquanto salva para evitar cliques duplos
            
            try {
                // Se marcou, adiciona "metodologia" no array. Se desmarcou, manda um array vazio.
                // (Para sistemas maiores com vários cursos, usaríamos arrayUnion e arrayRemove, mas aqui um só basta)
                const novoArrayCursos = isChecked ? ["metodologia"] : [];
                
                await updateDoc(doc(db, "utilizadores", alunoId), {
                    cursos_ead: novoArrayCursos
                });

                // Pequeno feedback visual no checkbox
                const row = checkboxEl.closest("tr");
                row.classList.add("bg-green-50");
                setTimeout(() => row.classList.remove("bg-green-50"), 1000);

            } catch (e) {
                console.error("Erro ao salvar permissão:", e);
                alert("Erro ao salvar permissão no banco de dados.");
                checkboxEl.checked = !isChecked; // Reverte visualmente se deu erro
            } finally {
                checkboxEl.disabled = false;
            }
        }

        // Inicia
        carregarAlunos();
        lucide.createIcons();
    </script>
</body>
</html>
